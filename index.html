<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>TOP Calculator</title>
</head>
<body>
    <main>

        <div id="calculatorBody">
            <div id="display">
                <div id="screen">
                    <div id="firstNumber">0</div>
                    <div id="operator"></div>
                    <div id="secondNumber"></div>
                </div>
            </div>
            <div class="buttons">
                <button class="noWrite" id="delete">DEL</button>
                <button class="noWrite" id="clear">AC</button>
                <button class="noWrite" id="percentage">%</button>
                <button class="operator">/</button>
                <button class="number">7</button>
                <button class="number">8</button>
                <button class="number">9</button>
                <button class="operator">x</button>
                <button class="number">4</button>
                <button class="number">5</button>
                <button class="number">6</button>
                <button class="operator">-</button>
                <button class="number">1</button>
                <button class="number">2</button>
                <button class="number">3</button>
                <button class="operator">+</button>
                <button class="noWrite" id="changeSign">+/-</button>
                <button class="number">0</button>
                <button id="comma">.</button>
                <button class="noWrite" id="run">=</button>  <!-- i think i will have to delete operator class from here -->
            </div>
        </div>

    </main>
</body>
</html>
